name: CI/CD

# Every push and pull request: backend tests (offline) and the frontend lint + build.
# Pushes to main (and manual runs): build the API image, push it to GHCR, deploy it to EC2 over SSH, check /health.
# The frontend itself is deployed by Vercel's Git integration.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   EC2_HOST       public IP or hostname of the instance (an Elastic IP)
#   EC2_USER       login user: ubuntu (Ubuntu) or ec2-user (Amazon Linux)
#   EC2_SSH_KEY    the private key (.pem contents) that can log in as EC2_USER
#   PUBLIC_URL     optional: the API URL (http://<elastic-ip>:8000), checked from GitHub after the deploy
# The app's API keys are NOT in GitHub: they live in /opt/lawbuddy/lawbuddy.env on the server.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/lawbuddy

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Validate the knowledge base
        run: python -m lawbuddy.kb.loader
      - name: Tests (offline)
        run: pytest -q

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  image:
    name: Build and push the API image
    needs: [backend-tests]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    needs: [image, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false            # never stop a deploy half-way
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2
          chmod 600 ~/.ssh/ec2
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy the stack files
        env:
          TARGET: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
        run: |
          scp -i ~/.ssh/ec2 deploy/docker-compose.yml deploy/deploy.sh "$TARGET":/opt/lawbuddy/
          ssh -i ~/.ssh/ec2 "$TARGET" 'chmod +x /opt/lawbuddy/deploy.sh'

      - name: Pull and start the new image (rolls back if unhealthy)
        env:
          TARGET: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          # The job's short-lived token logs the server in to GHCR for this pull only; it is logged out afterwards.
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/ec2 "$TARGET" "docker login ghcr.io -u $ACTOR --password-stdin"
          ssh -i ~/.ssh/ec2 "$TARGET" "/opt/lawbuddy/deploy.sh ${IMAGE}:${GITHUB_SHA}; status=\$?; docker logout ghcr.io; exit \$status"

      - name: Check the public URL
        env:
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
        run: |
          if [ -z "$PUBLIC_URL" ]; then echo "PUBLIC_URL not set; skipped"; exit 0; fi
          for i in $(seq 1 10); do
            if curl -fsS --max-time 10 "$PUBLIC_URL/health"; then echo; exit 0; fi
            sleep 6
          done
          echo "$PUBLIC_URL/health did not answer" >&2
          exit 1
