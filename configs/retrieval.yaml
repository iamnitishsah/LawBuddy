embedding:
  url: https://integrate.api.nvidia.com/v1/embeddings
  model: nvidia/nemotron-3.5-embed-8b
  api_key_env: NVIDIA_API_KEY
  dimensions: 1024
  batch_size: 32
  doc_input_type: passage
  query_input_type: query
  timeout_s: 15                      # per request at question time; a user should never wait minutes
  max_retries: 2                     # then search falls back to keyword (BM25) search

rerank:
  url: https://ai.api.nvidia.com/v1/retrieval/nvidia/nemotron-3.5-rerank-8b/reranking
  model: nvidia/nemotron-3.5-rerank-8b
  api_key_env: NVIDIA_API_KEY
  candidates: 20                     # top chunks from dense search that the reranker re-sorts
  timeout_s: 15
  max_retries: 2

search:
  top_k: 5                           # passages given to the LLM
  fallback_cooldown_s: 120           # after an API failure, use keyword search directly for this long
  # Safety floor, not a scope decision: below it, no chunk is shown to the model. Set from make smoke
  # (docs/findings.md): real questions scored >= 0.043 (rerank) and >= 0.316 (dense) across both question sets,
  # while clearly unrelated ones (tax, land, FIR, divorce) scored 0.022-0.033 (rerank). Near-topic out-of-scope
  # questions (eviction, PF, bounced cheque) score like real ones, so the triage step decides scope, not this.
  # Keyword fallback scores (BM25) are on another scale: no floor is applied to them.
  min_score:
    rerank: 0.035
    dense: 0.28
